services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env.dss}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.dss}
      POSTGRES_DB: ${DB_NAME:-dss_port}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./shipping_original.sql:/docker-entrypoint-initdb.d/01_shipping_original.sql:ro
      - ./db/init/02_normalize.sql:/docker-entrypoint-initdb.d/02_normalize.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME:-dss_port}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./server
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME:-dss_port}
      PORT: 3001
      WEB_ORIGIN: http://localhost:${WEB_PORT:-5173}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"

  web:
    build: ./web
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-3001}
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"

volumes:
  pgdata:
